<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <p class="js-workspace"></p>
    <p>
        <button onclick="
                calculation.value += '1'
                updateWorkspace()
            ">1</button>
        <button onclick="
                calculation.value += '2'
                updateWorkspace()
            ">2</button>
        <button onclick="
                calculation.value += '3'
                updateWorkspace()
            ">3</button>
        <button onclick="
                calculation.value += ' + '
                updateWorkspace()
            ">+</button>
    </p>

    <p>
        <button onclick="
                calculation.value += '4'
                updateWorkspace()
            ">4</button>
        <button onclick="
                calculation.value += '5'
                updateWorkspace()
            ">5</button>
        <button onclick="
                calculation.value += '6'
                updateWorkspace()
            ">6</button>
        <button onclick="
                calculation.value += ' - '
                updateWorkspace()
            ">-</button>
    </p>

    <p>
        <button onclick="
                calculation.value += '7'
                updateWorkspace()
            ">7</button>
        <button onclick="
                calculation.value += '8'
                updateWorkspace()
            ">8</button>
        <button onclick="
                calculation.value += '9'
                updateWorkspace()
            ">9</button>
        <button onclick="
                calculation.value += ' * '
                updateWorkspace()
            ">*</button>
    </p>

    <p>
        <button onclick="
                calculation.value += '0'
                updateWorkspace()
            ">0</button>
        <button onclick="
                calculation.value += '.'
                updateWorkspace()
            ">.</button>
        <button onclick="
        // calculation.value = Math.round(eval(calculation.value))
        calculation.value = eval(calculation.value)
        updateWorkspace()
        ">=</button>
        <button onclick="
                calculation.value += ' / '
                updateWorkspace()
            ">/</button>
    </p>
    <button onclick="
        calculation.value = '';
        updateWorkspace()
        console.log('Cleared.');
    ">Clear</button>

    
    <script>
        let calculation = JSON.parse(localStorage.getItem('saveCalculation')) ||{
            value: ''
        };
        document.querySelector('.js-workspace').innerHTML = calculation.value
        
        function updateWorkspace() {
            const workspace = document.querySelector('.js-workspace')
            localStorage.setItem('saveCalculation', JSON.stringify(calculation))
            workspace.innerHTML = calculation.value
        }
    </script>
</body>
</html>
